# DuckDB local. O lago (raw e meta em Parquet) fica em ELEITORADO_LAGO; o arquivo .duckdb é
# descartável: os históricos são restaurados de Parquet antes de cada execução.
eleitorado:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('ELEITORADO_LAGO', 'dados') }}/dev.duckdb"
      external_root: "{{ env_var('ELEITORADO_PUBLICO', 'dados/publico') }}/marts"
      threads: 4
      settings:
        memory_limit: 4GB
    prod:
      type: duckdb
      path: "{{ env_var('ELEITORADO_LAGO', 'dados') }}/eleitorado.duckdb"
      external_root: "{{ env_var('ELEITORADO_PUBLICO', 'dados/publico') }}/marts"
      threads: "{{ env_var('ELEITORADO_DUCKDB_THREADS', '4') | int }}"
      settings:
        memory_limit: "{{ env_var('ELEITORADO_DUCKDB_MEMORIA', '4GB') }}"
        preserve_insertion_order: false
    # agente: cópia local do lago de produção para o agente investigador (agente/preparar.py)
    agente:
      type: duckdb
      path: "{{ env_var('ELEITORADO_LAGO', 'dados-agente') }}/agente.duckdb"
      external_root: "{{ env_var('ELEITORADO_PUBLICO', 'dados-agente/publico') }}/marts"
      threads: 4
      settings:
        memory_limit: 4GB
    # ci: lê o lago vazio de dbt/tests/lago_vazio (só esquemas, sem dados)
    ci:
      type: duckdb
      path: "{{ env_var('ELEITORADO_LAGO', 'dados') }}/ci.duckdb"
      external_root: "{{ env_var('ELEITORADO_PUBLICO', 'dados/publico') }}/marts"
      threads: 4
