version: 2

unit_tests:
  - name: abertura_e_o_estabelecimento_mais_antigo
    description: >
      A data de abertura é o início de atividade mais antigo entre os estabelecimentos (a matriz
      atual pode ser nova); só a competência mais recente conta.
    model: int_rfb__empresas
    given:
      - input: ref('stg_rfb__empresas')
        rows:
          - {cnpj_raiz: '11222333', razao_social: EMPRESA A, natureza_juridica_codigo: '2062', porte_codigo: '05', competencia: '2026-09'}
          - {cnpj_raiz: '11222333', razao_social: NOME ANTIGO, natureza_juridica_codigo: '2062', porte_codigo: '05', competencia: '2026-08'}
      - input: ref('int_rfb__estabelecimentos')
        rows:
          - {cnpj: '11222333000181', cnpj_raiz: '11222333', matriz: true, data_inicio_atividade: '2025-03-24', situacao: ATIVA}
          - {cnpj: '11222333000262', cnpj_raiz: '11222333', matriz: false, data_inicio_atividade: '1998-05-01', situacao: ATIVA}
      - input: ref('int_rfb__socios')
        rows:
          - {cnpj_raiz: '11222333'}
      - input: ref('stg_rfb__simples')
        rows: []
      - input: ref('stg_rfb__codigos')
        rows:
          - {tabela: naturezas, codigo: '2062', descricao: Sociedade Empresária Limitada, competencia: '2026-09'}
    expect:
      rows:
        - {cnpj_raiz: '11222333', razao_social: EMPRESA A, natureza_juridica: Sociedade Empresária Limitada, porte: DEMAIS, data_abertura: '1998-05-01', matriz_cnpj: '11222333000181', estabelecimentos: 2, socios: 1, optante_simples: false}
