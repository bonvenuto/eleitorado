version: 2
models:
- name: int_tse__vinculos_parlamentares
  description: Ponte privada por candidatura, parlamentar, origem e evidência. Nomes isolados
    nunca confirmam; Senado sem CPF permanece pendente. Não juntar diretamente aos fatos.
  columns:
  - name: estado
    data_tests:
    - accepted_values:
        arguments:
          values:
          - confirmado
          - ambiguo
          - ausente
  - name: evidencias_privadas
    description: Lista privada ordenada de evidências oficiais, com coleta, referência,
      nome e documento.
  - name: regra_versao
    data_tests:
    - not_null
- name: int_tse__patrimonio
  columns:
  - name: candidatura_id
    data_tests:
    - unique
    - not_null
  - name: patrimonio
    description: DECIMAL(38,2) apenas da declaração efetiva. Ausência, valor ilegível ou
      origem concorrente resultam NULL.
  - name: patrimonio_observado
    description: Soma física privada somente de origem única; pode ser incompleta por item
      ilegível. Auditoria; nunca substitui patrimonio. Múltiplas origens resultam NULL.
  - name: pessoa_id
    description: CPF completo com namespace pessoa; exclusivamente privado.
  - name: cobertura_evolucao
    description: Motivo privado de pendência ou comparável. Empate de datas exclui todas
      as declarações empatadas.
  description: Uma linha privada por candidatura/eleição real. Sem itens não comprova declaração
    de zero. Origens de bens múltiplas bloqueiam o total mesmo se iguais; itens e multiplicidade
    são preservados. Pessoa exige CPF válido e nome civil não vazio coerente.
- name: int_tse__evolucao_patrimonial
  description: Todos os pares cronológicos de declarações efetivas da mesma pessoa privada
    coerente, sem janela. Datas empatadas excluídas; base zero tem percentual NULL. Variação
    declarada não equivale a renda.
  data_tests:
  - unique:
      arguments:
        column_name: to_json(struct_pack(anterior := candidatura_anterior_id, posterior
          := candidatura_posterior_id))
unit_tests:
- name: cpf_inequivoco
