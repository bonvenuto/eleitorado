      cpf_candidato_ausencia: null
      candidatura_elegivel: true
      nm_candidato: Pessoa Teste
      data_eleicao: '2020-11-15'
      cd_eleicao: '1'
      sq_candidato: '10'
  - input: ref('stg_camara__deputados_detalhe')
    rows:
    - &id001
      id_deputado: '10'
      cpf: '52998224725'
      nome_civil: Pessoa Teste
      _coleta_id: coleta
      data_referencia: '2024-01-01'
  - input: ref('stg_camara__ceap')
    rows: []
  - input: ref('stg_senado__senadores')
    rows: []
  expect:
