version: 2
models:
- name: int_tse__mapa_despesas
  description: Mapa privado único por despesa/prestação; NULL participa do consenso.
    Metadados conflitantes não são escolhidos.
  data_tests:
  - unique:
      arguments:
        column_name: to_json(struct_pack(cd_eleicao := cd_eleicao, sq_prestador_contas
          := sq_prestador_contas, sq_despesa := sq_despesa, tipo_prestacao :=
          tipo_prestacao, data_prestacao := data_prestacao))
- name: int_tse__pagamentos
  description: Parcelas privadas. Colapso só com igualdade integral da fonte na
    mesma origem, chave completa e gate comum elegível. Fato inelegível nunca
    autoriza publicação.
  columns:
  - name: item_id
    data_tests:
    - not_null
  - name: politica_versao
    data_tests:
    - not_null
- name: int_tse__auditoria_pagamentos
  description: Auditoria sempre privada. Valor retido é soma física, inclusive
    pendências; consumidores exigem fato_elegivel. Bruto = retido + removido para
    valores conhecidos. Política fixa tse_pagamentos_identicos_v1.
  data_tests:
  - unique:
      arguments:
        column_name: to_json(struct_pack(cd_eleicao := cd_eleicao, sq_prestador_contas
          := sq_prestador_contas, sq_despesa := sq_despesa, tipo_prestacao :=
          tipo_prestacao, data_prestacao := data_prestacao, sq_parcelamento_despesa
          := sq_parcelamento_despesa, ano_arquivo := ano_arquivo, versao_id :=
          versao_id))
  columns:
  - name: valor_bruto
    description: Soma monetária privada em DECIMAL(38,2).
  - name: valor_retido
    description: Soma monetária privada em DECIMAL(38,2).
  - name: valor_removido
    description: Soma monetária privada em DECIMAL(38,2).
