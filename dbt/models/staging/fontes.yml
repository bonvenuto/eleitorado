version: 2

# Raw e meta são Parquet no lago local (ELEITORADO_LAGO), espelho do bucket privado.
# Um arquivo por coleta: raw/<órgão>/<recurso>/<partição>/<coleta_id>.parquet.
sources:
  - name: raw_camara
    meta:
      external_location: "read_parquet('{{ env_var('ELEITORADO_LAGO', 'dados') }}/raw/camara/{name}/*/*.parquet', union_by_name = true)"
    tables:
      - name: ceap
      - name: deputados
  - name: raw_senado
    meta:
      external_location: "read_parquet('{{ env_var('ELEITORADO_LAGO', 'dados') }}/raw/senado/{name}/*/*.parquet', union_by_name = true)"
    tables:
      - name: ceaps
      - name: senadores
  - name: raw_cgu
    meta:
      external_location: "read_parquet('{{ env_var('ELEITORADO_LAGO', 'dados') }}/raw/cgu/{name}/*/*.parquet', union_by_name = true)"
    tables:
      - name: ceis
      - name: cnep
      - name: emendas
      - name: emendas_convenios
      - name: emendas_favorecidos
      - name: emendas_documentos
      - name: contratos
      - name: licitacoes
      - name: licitacoes_participantes

  - name: raw_ibge
    meta:
      external_location: "read_parquet('{{ env_var('ELEITORADO_LAGO', 'dados') }}/raw/ibge/{name}/*/*.parquet', union_by_name = true)"
    tables:
      - name: municipios
  # snapshots de todas as datas, recriados dos originais pelo `coletor reconstruir` (seção 7.4)
  - name: replay
    tables:
      - name: cgu__ceis
        meta:
          external_location: "read_parquet('{{ env_var('ELEITORADO_REPLAY', 'dados/replay') }}/raw/cgu/ceis/*/*.parquet', union_by_name = true)"
      - name: cgu__cnep
        meta:
          external_location: "read_parquet('{{ env_var('ELEITORADO_REPLAY', 'dados/replay') }}/raw/cgu/cnep/*/*.parquet', union_by_name = true)"
      - name: camara__deputados
        meta:
          external_location: "read_parquet('{{ env_var('ELEITORADO_REPLAY', 'dados/replay') }}/raw/camara/deputados/*/*.parquet', union_by_name = true)"
      - name: senado__senadores
        meta:
          external_location: "read_parquet('{{ env_var('ELEITORADO_REPLAY', 'dados/replay') }}/raw/senado/senadores/*/*.parquet', union_by_name = true)"
  - name: meta
    meta:
      external_location: "read_parquet('{{ env_var('ELEITORADO_LAGO', 'dados') }}/meta/{name}/*/*.parquet', union_by_name = true)"
    tables:
      - name: coletas
      - name: fontes
