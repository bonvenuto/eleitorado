name: eleitorado
version: "0.1.0"
config-version: 2
profile: eleitorado

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  eleitorado:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      # Parquet em ELEITORADO_PUBLICO/marts (external_root no profile): vai para o bucket público
      +materialized: external
      +options:
        compression: zstd

flags:
  send_anonymous_usage_stats: false
