name: eleitorado
version: "0.1.0"
config-version: 2
profile: eleitorado

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  eleitorado:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      # Parquet em ELEITORADO_PUBLICO/marts (external_root no profile): vai para o bucket público
      +materialized: external
      +options:
        compression: zstd
    # site público: arquivos JSON montados no SQL (coletor site), só a partir de marts e seeds
    site:
      +schema: site
      +materialized: table

seeds:
  eleitorado:
    +schema: site

vars:
  site_max_alertas: 200 # alertas por parlamentar ou empresa no arquivo (o total vai junto)
  site_top: 20 # itens das listas de maiores fornecedores, favorecidos, autores e órgãos
  site_busca_max: 5000 # empresas num bloco de busca antes de subdividir em 4 letras
  site_alertas_por_pagina: 500

flags:
  send_anonymous_usage_stats: false
