name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # o dbt inteiro sobre o lago vazio (só esquemas): modelos, testes de dados e unitários,
      # sem credencial nem dado nenhum
      - name: dbt sobre o lago vazio
        run: |
          uv run python scripts/lago_vazio.py
          mkdir -p "$ELEITORADO_PUBLICO/marts"
          uv run dbt run --project-dir dbt --profiles-dir dbt --target ci
          uv run dbt test --project-dir dbt --profiles-dir dbt --target ci
        env:
          ELEITORADO_LAGO: dbt/tests/lago_vazio
          ELEITORADO_PUBLICO: ${{ runner.temp }}/publico
