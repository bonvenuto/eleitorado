name: receita

# Base do CNPJ da Receita (onda C1): toda segunda; na prática coleta uma vez por mês, porque a
# competência já coletada é pulada. Só coleta e salva o estado: o pipeline diário roda o dbt e
# publica os marts.
on:
  schedule:
    - cron: "0 6 * * 1" # segunda, 03:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# o mesmo grupo do pipeline: os dois nunca escrevem no estado ao mesmo tempo
concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  ELEITORADO_PROJETO: ${{ vars.GCP_PROJETO }}
  ELEITORADO_BUCKET: ${{ vars.GCP_PROJETO }}-dados
  ELEITORADO_AMBIENTE: prod
  ELEITORADO_LAGO: dados
  ELEITORADO_PUBLICO: dados/publico
  ELEITORADO_VERSAO: ${{ github.sha }}
  ELEITORADO_ORIGEM: ${{ github.event_name == 'schedule' && 'agendada' || 'manual' }}

jobs:
  receita:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --no-dev
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_PIPELINE }}
      # O lago tem o raw com CPFs completos: no cache do Actions ele vai sempre cifrado, porque
      # workflows de pull request (inclusive de forks) conseguem restaurar caches da main.
      - name: cache do lago (cifrado)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: lago.tar.gpg
          key: lago-cifrado-${{ github.run_id }}
          restore-keys: lago-cifrado-
      - name: decifrar o lago
        env:
          LAGO_CHAVE: ${{ secrets.LAGO_CHAVE }}
        run: |
          set -o pipefail
          test -n "$LAGO_CHAVE" || { echo "::error::secret LAGO_CHAVE ausente"; exit 1; }
          if [ -f lago.tar.gpg ]; then
            if gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 \
                --decrypt lago.tar.gpg 3<<<"$LAGO_CHAVE" | tar -xf -; then
              echo "lago restaurado do cache"
            else
              echo "::warning::cache do lago ilegível; o estado vem inteiro do GCS"
              rm -rf dados/raw dados/meta dados/estado
            fi
            rm -f lago.tar.gpg
          fi
      - name: estado restaurar
        id: restaurar
        run: uv run coletor estado restaurar
      # as raízes de CNPJ que aparecem nos dados viram dados/rfb_raizes_interesse.parquet
      - name: raízes de interesse
        run: |
          mkdir -p "$ELEITORADO_PUBLICO/marts"
          uv run dbt run --project-dir dbt --profiles-dir dbt --target prod \
            --select +int_rfb__raizes_interesse
      - name: coleta da Receita
        run: uv run coletor executar --grupo receita
      # o que foi coletado vale mesmo se uma das coletas falhou
      - name: estado salvar
        if: always() && steps.restaurar.outcome == 'success'
        run: uv run coletor estado salvar
      - name: cifrar o lago
        id: cifrar
        if: always() && steps.restaurar.outcome == 'success'
        env:
          LAGO_CHAVE: ${{ secrets.LAGO_CHAVE }}
        run: |
          set -o pipefail
          test -n "$LAGO_CHAVE" || { echo "::error::secret LAGO_CHAVE ausente"; exit 1; }
          mkdir -p dados/raw dados/meta dados/estado
          tar -cf - dados/raw dados/meta dados/estado \
            | gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-fd 3 \
                --symmetric --cipher-algo AES256 --compress-algo none -o lago.tar.gpg 3<<<"$LAGO_CHAVE"
      - name: guardar cache do lago (cifrado)
        if: always() && steps.cifrar.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: lago.tar.gpg
          key: lago-cifrado-${{ github.run_id }}
