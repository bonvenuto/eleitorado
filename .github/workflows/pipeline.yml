name: pipeline

on:
  schedule:
    - cron: "30 10 * * *" # 07:30 em Brasília
  workflow_dispatch:
    inputs:
      reconstruir:
        description: "refazer os históricos a partir dos originais (primeira carga)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# nunca duas execuções escrevendo no estado ao mesmo tempo
concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  ELEITORADO_PROJETO: ${{ vars.GCP_PROJETO }}
  ELEITORADO_BUCKET: ${{ vars.GCP_PROJETO }}-dados
  ELEITORADO_AMBIENTE: prod
  ELEITORADO_LAGO: dados
  ELEITORADO_PUBLICO: dados/publico
  ELEITORADO_VERSAO: ${{ github.sha }}
  ELEITORADO_ORIGEM: ${{ github.event_name == 'schedule' && 'agendada' || 'manual' }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --no-dev
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_PIPELINE }}
      # O lago tem o raw com CPFs completos: no cache do Actions ele vai sempre cifrado, porque
      # workflows de pull request (inclusive de forks) conseguem restaurar caches da main.
      - name: cache do lago (cifrado)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: lago.tar.gpg
          key: lago-cifrado-${{ github.run_id }}
          restore-keys: lago-cifrado-
      - name: decifrar o lago
        env:
          LAGO_CHAVE: ${{ secrets.LAGO_CHAVE }}
        run: |
          set -o pipefail
          test -n "$LAGO_CHAVE" || { echo "::error::secret LAGO_CHAVE ausente"; exit 1; }
          if [ -f lago.tar.gpg ]; then
            if gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 \
                --decrypt lago.tar.gpg 3<<<"$LAGO_CHAVE" | tar -xf -; then
              echo "lago restaurado do cache"
            else
              echo "::warning::cache do lago ilegível; o estado vem inteiro do GCS"
              rm -rf dados/raw dados/meta dados/estado
            fi
            rm -f lago.tar.gpg
          fi
      - name: estado restaurar
        id: restaurar
        run: uv run coletor estado restaurar
      - name: coleta e dbt
        id: pipeline
        # 0: tudo certo; 3: só coletas falharam (o dbt passou e os marts podem ser publicados)
        run: |
          set +e
          uv run coletor pipeline
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          exit $codigo
      - name: reconstruir históricos
        if: inputs.reconstruir
        run: uv run coletor reconstruir --origem-prefixo ""
      # o que foi coletado e os históricos valem mesmo se um teste do dbt falhou
      - name: estado salvar
        if: always() && steps.restaurar.outcome == 'success'
        run: uv run coletor estado salvar
      - name: cifrar o lago
        id: cifrar
        if: always() && steps.restaurar.outcome == 'success'
        env:
          LAGO_CHAVE: ${{ secrets.LAGO_CHAVE }}
        run: |
          set -o pipefail
          test -n "$LAGO_CHAVE" || { echo "::error::secret LAGO_CHAVE ausente"; exit 1; }
          mkdir -p dados/raw dados/meta dados/estado
          tar -cf - dados/raw dados/meta dados/estado \
            | gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-fd 3 \
                --symmetric --cipher-algo AES256 --compress-algo none -o lago.tar.gpg 3<<<"$LAGO_CHAVE"
      - name: guardar cache do lago (cifrado)
        if: always() && steps.cifrar.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: lago.tar.gpg
          key: lago-cifrado-${{ github.run_id }}
      - name: publicar
        if: always() && (steps.pipeline.outputs.codigo == '0' || steps.pipeline.outputs.codigo == '3')
        run: uv run coletor publicar
        env:
          R2_CONTA: ${{ secrets.R2_CONTA }}
          R2_CHAVE_ID: ${{ secrets.R2_CHAVE_ID }}
          R2_SEGREDO: ${{ secrets.R2_SEGREDO }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
