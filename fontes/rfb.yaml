orgao: rfb
nome: Receita Federal do Brasil
portal: https://dados.gov.br/dados/conjuntos-dados/cadastro-nacional-da-pessoa-juridica---cnpj
# Base aberta do CNPJ: uma pasta por competência (AAAA-MM) no compartilhamento WebDAV da Receita.
# Recortada às raízes de CNPJ que aparecem nos dados do eleitorado (int_rfb__raizes_interesse). O
# usuário é o token público do compartilhamento. Grupo receita: a Receita bloqueia os IPs do GitHub
# Actions, então a coleta roda do computador do mantenedor (scripts/receita_local.ps1), fora do
# pipeline diário. Cadência mensal: o monitor só acusa atraso depois de 40 dias.
recursos:
  - id: empresas
    descricao: Empresas (cadastro por CNPJ básico)
    fonte_oficial: https://arquivos.receitafederal.gov.br/index.php/s/YggdBLfdninEJX9
    condicoes_uso: >-
      Dados abertos do CNPJ publicados pela Receita Federal no Portal Brasileiro de Dados Abertos
      (dados.gov.br), de uso livre (Decreto 8.777/2016).
    adaptador: webdav_zip
    url: https://arquivos.receitafederal.gov.br/public.php/webdav/
    parametros: {usuario: YggdBLfdninEJX9}
    publicacao: snapshot
    competencia:
      tipo: data_arquivo
      pagina: https://arquivos.receitafederal.gov.br/public.php/webdav/
    cadencia: {corrente: mensal}
    formato: {tipo: csv}
    grupo: receita
    recorte:
      arquivos: "Empresas*.zip"
      colunas: [cnpj_basico, razao_social, natureza_juridica, qualificacao_responsavel,
        capital_social, porte_empresa, ente_federativo_responsavel]
      raizes: rfb_raizes_interesse.parquet
  - id: estabelecimentos
