[project]
name = "eleitorado"
version = "0.1.0"
description = "Ingestão de dados públicos em DuckDB e Parquet"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.108",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "google-cloud-storage>=2.18",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
]

[project.scripts]
coletor = "coletor.cli:main"
agente = "agente.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coletor", "agente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracao: acessa GCP e fontes reais"]
addopts = "-m 'not integracao'"

[tool.ruff]
line-length = 100
target-version = "py312"
# os planos em docs/ trazem trechos de código fora de contexto (métodos soltos, por exemplo)
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
